# Lint and browser tests for every push and PR to staging and main.
name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 has no browser for the newer ubuntu-latest image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
