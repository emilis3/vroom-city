<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vroom City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #mode { position: fixed; top: 16px; right: 24px; font-size: 44px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0005; }
  #hud { position: fixed; top: 16px; left: 24px; font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0005; }
  #help { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #fff; font-size: 18px; text-shadow: 0 2px 0 #0006; }
  #yay { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font-size: 120px; font-weight: 900; color: #ffd84a;
         text-shadow: 0 8px 0 #c76b00; opacity: 0; transform: scale(.5); transition: all .3s; pointer-events: none; }
  #yay.show { opacity: 1; transform: scale(1); }
  #muted { position: fixed; right: 24px; bottom: 64px; font-size: 40px; text-shadow: 0 3px 0 #0005; display: none; pointer-events: none; }
  #muted.show { display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #4fb3ffd0; color: #fff; cursor: pointer; text-align: center; }
  #start h1 { font-size: 110px; margin: 0; text-shadow: 0 8px 0 #0003; }
  #start p { font-size: 36px; margin: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">⭐ 0</div>
<div id="mode">H = 🚁</div>
<div id="yay">Great job!</div>
<div id="help"></div>
<div id="muted" title="Sound is off: press M">🔇</div>
<div id="start"><h1>🚗 Vroom City!</h1><p>Catch the stars! Press H to fly the helicopter 🚁</p><p>Drive into the lake to sail the speedboat 🚤</p><p>A rocket 🚀 is waiting at the edge of town</p><p>Press any key to start</p></div>
<script>
"use strict";
// ---------- WebGL setup ----------
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: true });
// if the graphics card gives up, say so kindly instead of leaving a blank screen
function sorry(msg, note = '') {
  const s = document.getElementById('start');
  s.innerHTML = `<h1>🚗 Vroom City!</h1><p>${msg}</p><small style="opacity:.75;margin-top:24px;font-size:16px">${note}</small>`;
  s.style.display = '';
}
// what was happening when the graphics last dropped out, kept so a grown-up can send it to us
function lastDrop() { try { return localStorage.getItem('vroomDrop') || ''; } catch { return ''; } }
const easy = !!lastDrop(); // the graphics dropped out here before: easy mode, with a simple liftoff
// the grey note under the drop-out message, with enough detail to tell where it went wrong
function dropNote(d) {
  return `Graphics dropped out: ${d.mode} ${d.scene} height ${Math.round(d.height)}, ${d.w}×${d.h}, ${Math.round(d.fps)} fps, ` +
    `easy mode ${d.easy ? 'on' : 'off'}, drop-out ${d.n}, ` +
    (d.mode === 'rocket' && d.lift !== null ? `${Math.floor(d.lift)} s after liftoff, ` : '') + `${d.gpu} (${d.time})`;
}
if (!gl) {
  sorry('The browser has paused 3D graphics 😴<br>Close every browser window, open it again and come back', lastDrop());
  throw new Error('WebGL is not available');
}
cv.addEventListener('webglcontextlost', e => {
  e.preventDefault(); // lets the browser give the graphics back
  ac?.suspend();
  let n = 1;
  try { n = (parseInt(localStorage.getItem('vroomDrops'), 10) || 0) + 1; localStorage.setItem('vroomDrops', n); } catch { /* private mode */ }
  const note = dropNote({ mode, scene, height: rocket.y, w: cv.width, h: cv.height, fps: 1000 / Math.max(1, frameMs), easy, n,
    lift: rocket.lift === null ? null : T - rocket.lift, gpu: gpuName, time: new Date().toISOString().slice(0, 16) });
  try { localStorage.setItem('vroomDrop', note); } catch { /* private mode */ }
  sorry('Oops, the graphics took a little break<br>Press any key to play again', note);
  addEventListener('keydown', () => location.reload(), { once: true });
});
cv.addEventListener('webglcontextrestored', () => location.reload());
const gpuInfo = gl.getExtension('WEBGL_debug_renderer_info');
const gpuName = gpuInfo ? gl.getParameter(gpuInfo.UNMASKED_RENDERER_WEBGL) : 'unknown graphics';
const quality = { shadows: false, maxDpr: 2 }; // the safety net lowers these on slow computers
function resize() {
  const d = Math.min(devicePixelRatio || 1, quality.maxDpr);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
}
addEventListener('resize', resize); resize();

// Every vertex: position, normal, colour, material (0 lit, 1 water, 2 glow halo, 3 bright light)
const VS = `attribute vec3 aPos, aNor; attribute vec4 aCol;
uniform mat4 uVP, uM, uLVP; uniform mat3 uNM;
varying vec3 vN, vW; varying vec4 vC, vL;
void main() {
  vec4 w = uM * vec4(aPos, 1.0); vW = w.xyz;
  vN = uNM * aNor; vC = aCol;
  vL = uLVP * vec4(w.xyz + normalize(vN) * 0.15, 1.0); // nudged along the normal so faces don't shadow themselves
  gl_Position = uVP * w;
}`;
const FS = `precision highp float;
varying vec3 vN, vW; varying vec4 vC, vL;
uniform vec3 uTint, uCam, uSun, uHaze; uniform vec2 uFog; uniform float uAlpha, uTime, uShadowOn, uTexel;
uniform sampler2D uShadow;
float sunlit() {
  if (uShadowOn < 0.5) return 1.0;
  vec3 p = vL.xyz / vL.w * 0.5 + 0.5;
  vec2 e = min(p.xy, 1.0 - p.xy);
  float edge = smoothstep(0.0, 0.08, min(e.x, e.y)); // shadows fade out at the edge of the shadow area
  if (edge <= 0.0 || p.z >= 1.0) return 1.0;
  float s = 0.0, z = p.z - 0.00005;
  vec2 t = p.xy / uTexel - 0.5, f = fract(t), b = (floor(t) + 0.5) * uTexel;
  for (int i = -1; i <= 2; i++) for (int j = -1; j <= 2; j++) { // 4x4 texels, edge ones weighted for smooth soft edges
    float w = (i == -1 ? 1.0 - f.x : i == 2 ? f.x : 1.0) * (j == -1 ? 1.0 - f.y : j == 2 ? f.y : 1.0);
    s += w * (z <= texture2D(uShadow, b + vec2(float(i), float(j)) * uTexel).r ? 1.0 : 0.0);
  }
  return mix(1.0, s / 9.0, edge);
}
void main() {
  vec3 n = normalize(vN), col = vC.rgb * uTint, c;
  float m = vC.a, f = smoothstep(uFog.x, uFog.y, distance(vW, uCam));
  if (m > 1.5 && m < 2.5) { // glow halo: bright in the middle, fading to the rim and into the haze
    float g = abs(dot(n, normalize(uCam - vW)));
    gl_FragColor = vec4(col, uAlpha * g * g * (1.0 - f)); return;
  }
  if (m > 2.5) c = col;
  else {
    float ndl = max(dot(n, uSun), 0.0);
    vec3 amb = mix(vec3(0.40, 0.38, 0.35), vec3(0.50, 0.53, 0.58), n.y * 0.5 + 0.5); // sky light from above, ground bounce below
    c = col * (amb + vec3(1.0, 0.96, 0.86) * 0.56 * ndl * (ndl > 0.0 ? sunlit() : 1.0));
    if (m > 0.5) { // water: slow ripples with little sparkles
      float r = sin(vW.x * 0.35 + uTime * 1.3) * sin(vW.z * 0.3 - uTime * 1.1) + 0.5 * sin((vW.x + vW.z) * 0.8 + uTime * 2.0);
      c *= 1.0 + 0.07 * r; c += vec3(0.3) * pow(max(r - 0.9, 0.0) / 0.6, 2.0);
    }
  }
  gl_FragColor = vec4(mix(c, uHaze, f), uAlpha);
}`;
// Shadow pass: depth only, as seen from the sun
const SVS = `attribute vec3 aPos; uniform mat4 uLVP, uM; void main() { gl_Position = uLVP * uM * vec4(aPos, 1.0); }`;
const SFS = `precision mediump float; void main() { gl_FragColor = vec4(1.0); }`;
// Sky: one big triangle behind everything, pale at the horizon, deep blue above, with a soft sun
const KVS = `attribute vec3 aPos; varying vec2 vP; void main() { vP = aPos.xy; gl_Position = vec4(aPos.xy, 0.0, 1.0); }`;
const KFS = `precision highp float; varying vec2 vP;
uniform vec3 uF, uR, uU, uSun, uHaze, uTop; uniform vec2 uTan; uniform float uSpace, uTime;
void main() {
  vec3 d = normalize(uF + vP.x * uTan.x * uR + vP.y * uTan.y * uU);
  vec3 c = mix(uHaze, uTop, pow(clamp(d.y, 0.0, 1.0), 0.6));
  // climbing to space: the blue fades to black, and twinkling stars come out
  vec3 q = floor(d * 260.0);
  float h = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
  float tw = 0.6 + 0.4 * sin(uTime * 3.0 + h * 60.0);
  c = mix(c, vec3(0.01, 0.015, 0.05) + vec3(0.03, 0.02, 0.08) * (1.0 - abs(d.y)), uSpace);
  c += vec3(step(0.996, h) * tw * smoothstep(0.3, 1.0, uSpace));
  float s = max(dot(d, uSun), 0.0);
  c += vec3(1.0, 0.95, 0.75) * (smoothstep(0.9990, 0.9994, s) * 0.7 + pow(s, 80.0) * 0.3);
  gl_FragColor = vec4(c, 1.0);
}`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const UNIFORMS = ['uVP', 'uM', 'uNM', 'uLVP', 'uTint', 'uCam', 'uSun', 'uHaze', 'uFog', 'uAlpha', 'uTime', 'uShadowOn', 'uTexel',
  'uShadow', 'uF', 'uR', 'uU', 'uTop', 'uTan', 'uSpace'];
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  ['aPos', 'aNor', 'aCol'].forEach((n, i) => gl.bindAttribLocation(p, i, n));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = { p };
  for (const n of UNIFORMS) u[n] = gl.getUniformLocation(p, n);
  return u;
}
const MAIN = program(VS, FS), SHADOWP = program(SVS, SFS), SKYP = program(KVS, KFS);
let prog = MAIN; // the program in use
function use(p) { prog = p; gl.useProgram(p.p); }
for (const i of [0, 1, 2]) gl.enableVertexAttribArray(i);
gl.enable(gl.DEPTH_TEST);

// Shadow map: the sun's view of everything near the player, kept in a depth texture
const SM = 2048, SH = 130; // texture size, half-width of the shadow area in world units
const depthExt = gl.getExtension('WEBGL_depth_texture');
const shadowTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, shadowTex);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
  [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
let shadowFB = null;
if (depthExt) {
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT, SM, SM, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  const colour = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, colour);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA4, SM, SM);
  shadowFB = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, colour);
  quality.shadows = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
// no shadows possible: a 1x1 white texture keeps the shader happy
if (!quality.shadows) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));

function makeBuffer(arr) {
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW); return b;
}
function bind(b) {
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 40, 24);
}
const toMesh = arr => ({ buf: makeBuffer(arr), n: arr.length / 10 });

function hex(h) { return [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255]; }

// ---------- Low-poly shapes ----------
// A shape is a list of flat convex faces (corners in order) around its centre. mesh() places it,
// gives every triangle its own flat normal pointing outward, and appends the vertices to `out`.
function boxShape() {
  const c = (x, y, z) => [x * .5, y * .5, z * .5];
  return [[c(-1, -1, -1), c(1, -1, -1), c(1, -1, 1), c(-1, -1, 1)], [c(-1, 1, -1), c(1, 1, -1), c(1, 1, 1), c(-1, 1, 1)],
    [c(-1, -1, -1), c(1, -1, -1), c(1, 1, -1), c(-1, 1, -1)], [c(-1, -1, 1), c(1, -1, 1), c(1, 1, 1), c(-1, 1, 1)],
    [c(-1, -1, -1), c(-1, 1, -1), c(-1, 1, 1), c(-1, -1, 1)], [c(1, -1, -1), c(1, 1, -1), c(1, 1, 1), c(1, -1, 1)]];
}
// box whose top is shrunk to tx by tz of the bottom (tx = 0 makes a gable roof with its ridge along z)
function frustumShape(tx, tz = tx) {
  const b = [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]];
  const lo = b.map(([x, z]) => [x, -.5, z]), hi = b.map(([x, z]) => [x * tx, .5, z * tz]);
  return [lo, hi, ...lo.map((p, i) => [p, lo[(i + 1) % 4], hi[(i + 1) % 4], hi[i]])];
}
// n-sided cylinder along `axis`, top radius scaled by k (k = 0 makes a cone)
function prismShape(n, k = 1, axis = 'y') {
  const ring = (y, r) => Array.from({ length: n }, (_, i) => {
    const a = (i + .5) / n * Math.PI * 2, p = [Math.cos(a) * r * .5, y, Math.sin(a) * r * .5];
    return axis === 'y' ? p : axis === 'x' ? [p[1], p[0], p[2]] : [p[0], p[2], p[1]];
  });
  const lo = ring(-.5, 1), hi = ring(.5, k);
  return [lo, hi, ...lo.map((p, i) => [p, lo[(i + 1) % n], hi[(i + 1) % n], hi[i]])];
}
// faceted ball: an icosahedron, split `level` times
function icoShape(level) {
  const t = (1 + Math.sqrt(5)) / 2;
  let tris = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
  const v = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
  for (let l = 0; l < level; l++) {
    const next = [], mid = (a, b) => { v.push(v[a].map((x, i) => (x + v[b][i]) / 2)); return v.length - 1; };
    for (const [a, b, c] of tris) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
    tris = next;
  }
  const u = v.map(p => { const l = Math.hypot(...p) * 2; return p.map(x => x / l); });

// box with bevelled edges and corners, in real units (the bevel stays the same size whatever the box size)
function bevelShape(w, h, d, r) {
  const A = [w / 2, h / 2, d / 2], Bv = A.map(a => a - r), faces = [];
  const pt = (s, k) => s.map((sg, i) => sg * (i === k ? A[i] : Bv[i]));
  const S = [-1, 1];
  for (let k = 0; k < 3; k++) for (const s of S) { // big flat faces
    const u = (k + 1) % 3, v = (k + 2) % 3, f = [];
    for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const sg = [0, 0, 0]; sg[k] = s; sg[u] = su; sg[v] = sv; f.push(pt(sg, k)); }
    faces.push(f);
  }
  for (let k1 = 0; k1 < 3; k1++) for (let k2 = k1 + 1; k2 < 3; k2++) for (const s1 of S) for (const s2 of S) { // bevelled edges
    const o = 3 - k1 - k2, sg = t => { const g = [0, 0, 0]; g[k1] = s1; g[k2] = s2; g[o] = t; return g; };
    faces.push([pt(sg(-1), k1), pt(sg(1), k1), pt(sg(1), k2), pt(sg(-1), k2)]);
  }
  for (const a of S) for (const b of S) for (const c of S) faces.push([0, 1, 2].map(k => pt([a, b, c], k))); // corners

}
// flat five-pointed star facing +z
function starShape() {
  const pts = Array.from({ length: 10 }, (_, i) => {
    const a = i / 10 * Math.PI * 2 + Math.PI / 2, r = i % 2 ? .21 : .5;
    return [Math.cos(a) * r, Math.sin(a) * r];
  });
  const fz = (z) => pts.map(([x, y]) => [x, y, z]), f = fz(.13), b = fz(-.13), faces = [];
  for (let i = 0; i < 10; i++) {
    const j = (i + 1) % 10;
    faces.push([[0, 0, .2], f[i], f[j]], [[0, 0, -.2], b[i], b[j]], [f[i], f[j], b[j], b[i]]);
  }

}
const BOX = boxShape(), GABLE = frustumShape(0, 1), ICO1 = icoShape(1), ICO2 = icoShape(2),
      CYL6 = prismShape(6, .8), CONE8 = prismShape(8, 0), DISC = prismShape(24), WHEEL = prismShape(12, 1, 'x'),
      LENS = prismShape(10, 1, 'z'), BOOM = prismShape(8, .45, 'z'), ROD = prismShape(8, 1, 'z'), STAR = starShape();

// put a shape centred at (x, y, z), scaled, turned by yaw around the up axis
function mesh(shape, x, y, z, sx, sy, sz, yaw, col, mat = 0, out = STATIC) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const tf = p => [x + p[0] * sx * c + p[2] * sz * s, y + p[1] * sy, z - p[0] * sx * s + p[2] * sz * c];
  for (const face of shape) {
    const q = face.map(tf);
    for (let i = 1; i < q.length - 1; i++) {
      let a = q[0], b = q[i], d = q[i + 1];
      let n = cross(sub(b, a), sub(d, a));
      const l = Math.hypot(...n);
      if (l < 1e-9) continue; // squashed corner, nothing to draw
      const m = [(a[0] + b[0] + d[0]) / 3 - x, (a[1] + b[1] + d[1]) / 3 - y, (a[2] + b[2] + d[2]) / 3 - z];
      if (dot(n, m) < 0) { [b, d] = [d, b]; n = n.map(v => -v); } // turn it to face outward
      for (const p of [a, b, d]) out.push(p[0], p[1], p[2], n[0] / l, n[1] / l, n[2] / l, col[0], col[1], col[2], mat);

}

// ---------- Matrix helpers ----------
function persp(fov, asp, n, f) {

function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

// ---------- Build the city (static geometry baked into one buffer) ----------
// rnd() lays out the town, the countryside and the stars; drnd() only picks decorations, so
// adding decorations never moves anything you can bump into or collect.
let seed = 12345;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

let dseed = 777;

const N = 7, R = 12, B = 44, P = B + R, W = N * P;
const LIM = 280; // how far past the town you can go
const STATIC = [], CLOUDS = [];
// Everything solid: car bumps into the ones with car:true, the helicopter flies over all of them.

    const road = Math.floor(rnd() * (N + 1)) * P, along = 8 + rnd() * (W - 16);
    const [x, z] = rnd() < .5 ? [road, along] : [along, road];
    if (Math.hypot(x - me().x, z - me().z) > 40) return { x, y: 2.2, z, sky: false, phase: rnd() * 6 };
  }
}
function skyStar() { // only the helicopter can reach these: on mountain tops or high above town
  const phase = rnd() * 6;
  if (rnd() < .5) { const p = pick(mountains).peak; return { x: p.x, y: p.y + 4, z: p.z, sky: true, phase }; }
  const x = rnd() * W, z = rnd() * W;
  return { x, y: groundAt(x, z, 3) + 12 + rnd() * 25, z, sky: true, phase };
}
function waterStar() { // only the boat can catch these: out on the lake and the river, away from the shore
  for (;;) {
    let x, z;
    if (rnd() < .5) { x = lake.x + (rnd() - .5) * LAKEW; z = lake.z + (rnd() - .5) * LAKED; }
    else {
      const i = 1 + Math.floor(rnd() * (river.length - 1)), a = river[i - 1], b = river[i], t = rnd();
      x = a.x + (b.x - a.x) * t; z = a.z + (b.z - a.z) * t;
    }
    if (!inWater(x, z, 4) || ramps.some(r => Math.hypot(r.x - x, r.z - z) < r.r + 3)) continue;
    if (Math.hypot(x - me().x, z - me().z) > 40) return { x, y: 2.2, z, sky: false, water: true, phase: rnd() * 6 };
  }
}
for (let i = 0; i < 14; i++) stars.push(roadStar());
for (let i = 0; i < 10; i++) stars.push(skyStar());
for (let i = 0; i < 6; i++) stars.push(waterStar());

// ducks paddle about the lake, and scatter with a quack when the boat comes near
const ducks = [];
for (let tries = 0; ducks.length < 6 && tries < 500; tries++) {
  const x = lake.x + (rnd() - .5) * (LAKEW - 12), z = lake.z + (rnd() - .5) * (LAKED - 12);
  if (inWater(x, z, 4)) ducks.push({ x, z, hx: x, hz: z, a: rnd() * 6.283, scared: false, phase: rnd() * 6 });
}

function hits(x, z, r = 1.7, self = null) { // self: the machine asking, which is not in its own way
  if (x < -LIM || x > W + LIM || z < -LIM || z > W + LIM) return true;
  for (const o of solids) if (o.car && x > o.x0 - r && x < o.x1 + r && z > o.z0 - r && z < o.z1 + r) return true;
  for (const b of blocks) if (!b.held && b.y < 1.5 && Math.abs(x - b.x) < 1 + r && Math.abs(z - b.z) < 1 + r) return true;
  for (const m of machines) if (m !== self && Math.hypot(x - m.x, z - m.z) < m.r + r - .5) return true;
  return false;
}
function puff(x, y, z, n) {
  for (let k = 0; k < n; k++) confetti.push({
    x, y, z, vx: (rnd() - .5) * 14, vy: 6 + rnd() * 10, vz: (rnd() - .5) * 14, floor: Math.max(.2, y - 3),
    col: pick(RAINBOW), life: 1.6 + rnd()
  });
}
const HELP = {

const landed = () => mode === 'rocket' && scene === 'earth' && rocket.y === 0;
// the badge and help line follow the vehicle, and where it is

  const badge = { car: nm ? 'H = ' + MACHINE_ICON[nm.kind] : atStation ? 'H = 🚀' : 'H = 🚁', boat: 'H = 🚁', heli: atStation ? 'H = 🚀' : 'H = 🚗', buggy: 'H = 🚀',
    rocket: landed() ? 'H = 🚗' : '🚀', digger: 'H = 🚗', truck: 'H = 🚗', dozer: 'H = 🚗', crane: 'H = 🚗' }[mode];

function setMode(m) { mode = m; refreshHud(); }
setMode('car');
// car and boat swap where the water starts, with a 1.5 margin either side of the shore so they never flicker
const SHORE = 1.5;
function toBoat(from) {

}
function toCar() {
  Object.assign(car, { x: boat.x, z: boat.z, a: boat.a, v: Math.max(-8, Math.min(22, boat.v)), steer: boat.steer });
  setMode('car'); splashSound(); splash(car.x, car.z, 20); puff(car.x, 1, car.z, 15);
}
// ---------- Rocket: board on the station, blast off, space, the Moon and home again ----------
function clearFx() { fx.length = 0; confetti.length = 0; snapCam = true; }
function boardRocket() {
  Object.assign(rocket, { x: station.x, y: 0, z: station.z, a: station.a + Math.PI, // the camera looks back at town
    v: 0, vy: 0, pitch: 0, count: 3.4, thrust: 0, auto: false, lift: null });

}
function leaveRocket() { // the car comes back on the pad, between the rocket and the road, facing town

}

function landOnMoon() {

  Object.assign(rocket, { x: 0, y: 60, z: 0, v: 0, vy: 0, pitch: 0, auto: true });

function leaveMoon() {

  Object.assign(rocket, { x: MOON.x, y: MOON.y + MOON.r + 50, z: MOON.z, v: 0, vy: 0, pitch: 0, auto: false });

function buggyOut() { // the buggy rolls out of the rocket
  Object.assign(buggy, { x: 4 * Math.sin(rocket.a + 1.57), y: 0, z: 4 * Math.cos(rocket.a + 1.57), a: rocket.a + 1.57, v: 6, vy: 0, steer: 0, g: 0 });
  setMode('buggy'); puff(buggy.x, 1, buggy.z, 15);
}
function backInRocket() { Object.assign(rocket, { y: 0, vy: 0, thrust: 0, auto: false }); setMode('rocket'); whoosh(true); puff(buggy.x, 1, buggy.z, 15); }

function switchVehicle() {
  if (isMachine(mode)) { leaveMachine(); return; }
  const nm = nearMachine();
  if (nm) { boardMachine(nm); return; }
  if (mode === 'rocket') { if (landed()) leaveRocket(); return; } // nothing happens in flight
  if (mode === 'buggy') { backInRocket(); return; }
  if ((mode === 'car' && inStation(car.x, car.z)) || (mode === 'heli' && inStation(heli.x, heli.z))) { boardRocket(); return; }
  if (mode !== 'heli') {
    const v = me();
    Object.assign(heli, { x: v.x, y: 0, z: v.z, a: v.a, v: 0, lift: 2.5 });
    setMode('heli'); whoosh(true); puff(v.x, 1, v.z, 25);
  } else if (inWater(heli.x, heli.z, SHORE)) { // over water the helicopter lands as the boat
    toBoat({ x: heli.x, z: heli.z, a: heli.a }); whoosh(false);
  } else {
    // land the car right under the helicopter, or at the nearest free spot on dry land
    let spot = null;
    for (let r = 0; !spot && r < 300; r += 3)
      for (let k = 0; k < 16 && !spot; k++) {
        const x = heli.x + Math.cos(k / 16 * 6.283) * r, z = heli.z + Math.sin(k / 16 * 6.283) * r;
        if (!hits(x, z) && onLand(x, z, SHORE)) spot = { x, z };
      }
    if (spot) Object.assign(car, spot);
    Object.assign(car, { a: heli.a, v: 0, steer: 0 });
    setMode('car'); whoosh(false); puff(car.x, 1, car.z, 25);
  }
}

addEventListener('keydown', e => {
  if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code === 'Tab') e.preventDefault();
  if (!started) {
    started = true; document.getElementById('start').style.display = 'none';
    initAudio();
    document.documentElement.requestFullscreen?.().catch(() => {});
    return;
  }
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'Space' && mode === 'car') horn();
  if (e.code === 'Space' && mode === 'boat') toot();
  if (e.code === 'Space' && isMachine(mode)) machineAction(me());
  if (e.code === 'KeyH' || e.code === 'Enter') switchVehicle();
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const held = (...c) => c.some(k => keys.has(k));

function driveCar(dt) {
  const up = held('ArrowUp', 'KeyW'), down = held('ArrowDown', 'KeyS');
  const left = held('ArrowLeft', 'KeyA'), right = held('ArrowRight', 'KeyD');
  if (up) car.v += (car.v < 0 ? 30 : 14) * dt;
  else if (down) car.v -= (car.v > 0 ? 30 : 10) * dt;
  else car.v *= Math.pow(.35, dt);
  car.v = Math.max(-8, Math.min(22, car.v));
  const target = (left ? 1 : 0) - (right ? 1 : 0);
  car.steer += (target - car.steer) * Math.min(1, dt * 8);
  car.a += car.steer * 2.0 * dt * Math.max(-1, Math.min(1, car.v / 5));

  car.spin += car.v * dt / .48; // wheels roll with the car
  const nx = car.x + Math.sin(car.a) * car.v * dt, nz = car.z + Math.cos(car.a) * car.v * dt;
  let bumped = false;
  if (!hits(nx, car.z)) car.x = nx; else bumped = true;
  if (!hits(car.x, nz)) car.z = nz; else bumped = true;
  if (bumped) {
    if (Math.abs(car.v) > 3 && T - lastBoing > .5) { boing(); lastBoing = T; }
    car.v *= -0.3;
  }
  if (inWater(car.x, car.z, SHORE)) toBoat(car);
}

function driveBoat(dt) {
  const up = held('ArrowUp', 'KeyW'), down = held('ArrowDown', 'KeyS');
  const left = held('ArrowLeft', 'KeyA'), right = held('ArrowRight', 'KeyD');
  if (up) boat.v += (boat.v < 0 ? 30 : 13) * dt;
  else if (down) boat.v -= (boat.v > 0 ? 22 : 10) * dt;
  else boat.v *= Math.pow(.6, dt); // glides on when you let go
  boat.v = Math.max(-8, Math.min(28, boat.v));
  const target = (left ? 1 : 0) - (right ? 1 : 0);
  boat.steer += (target - boat.steer) * Math.min(1, dt * 6);
  boat.a += boat.steer * 1.8 * dt * Math.max(-1, Math.min(1, boat.v / 5));

  const nx = boat.x + Math.sin(boat.a) * boat.v * dt, nz = boat.z + Math.cos(boat.a) * boat.v * dt;
  let bumped = false;
  if (!hits(nx, boat.z)) boat.x = nx; else bumped = true;
  if (!hits(boat.x, nz)) boat.z = nz; else bumped = true;
  if (bumped) { // only the edge of the world
    if (Math.abs(boat.v) > 3 && T - lastBoing > .5) { boing(); lastBoing = T; }
    boat.v *= -0.3;
  }

  // wave ramps: fast makes a big hop, slow just a little bump
  const ramp = ramps.find(r => Math.hypot(r.x - boat.x, r.z - boat.z) < r.r);
  if (ramp && !boat.onRamp && boat.hop === 0) {
    const fast = Math.abs(boat.v) > 14;
    boat.vy = fast ? 5 + Math.abs(boat.v) * .2 : 1.5;
    if (fast) { splashSound(); splash(boat.x, boat.z, 18); }
  }
  boat.onRamp = !!ramp;
  if (boat.hop > 0 || boat.vy > 0) {
    boat.vy -= 20 * dt; boat.hop += boat.vy * dt;
    if (boat.hop <= 0) { // soft landing
      if (boat.vy < -5) { splashSound(); splash(boat.x, boat.z, 24); }
      boat.hop = 0; boat.vy = 0;
    }
  }
  boat.y = .2 + boat.hop;
  if (onLand(boat.x, boat.z, SHORE)) toCar();
}

function updateDucks(dt) {
  for (const d of ducks) {
    const bx = d.x - boat.x, bz = d.z - boat.z, near = Math.hypot(bx, bz);
    if (mode === 'boat' && near < 12 && !d.scared) { d.scared = true; quack(); }
    if (mode !== 'boat' || near > 18) d.scared = false;
    let dx, dz, sp;
    if (d.scared) { dx = bx / (near || 1); dz = bz / (near || 1); sp = 7; } // paddle away fast
    else { // drift slowly back home
      const hx = d.hx - d.x, hz = d.hz - d.z, l = Math.hypot(hx, hz);
      if (l < 1) { d.a += Math.sin(T * .7 + d.phase) * dt; continue; }
      dx = hx / l; dz = hz / l; sp = 1.2;
    }
    const nx = d.x + dx * sp * dt, nz = d.z + dz * sp * dt;
    if (inLake(nx, nz, -3) && inWater(nx, nz, 1.5)) { d.x = nx; d.z = nz; }
    const want = Math.atan2(dx, dz), turn = Math.atan2(Math.sin(want - d.a), Math.cos(want - d.a));
    d.a += turn * Math.min(1, dt * 5);
  }
}

function flyHeli(dt) {
  const fwd = held('ArrowUp'), back = held('ArrowDown');
  const left = held('ArrowLeft', 'KeyA'), right = held('ArrowRight', 'KeyD');
  const rise = held('KeyW', 'Space', 'PageUp'), sink = held('KeyS', 'ShiftLeft', 'ShiftRight', 'PageDown');
  if (fwd) heli.v += 20 * dt; else if (back) heli.v -= 20 * dt; else heli.v *= Math.pow(.4, dt);
  heli.v = Math.max(-10, Math.min(32, heli.v));
  heli.a += ((left ? 1 : 0) - (right ? 1 : 0)) * 1.7 * dt;
  heli.x = Math.max(-LIM, Math.min(W + LIM, heli.x + Math.sin(heli.a) * heli.v * dt));
  heli.z = Math.max(-LIM, Math.min(W + LIM, heli.z + Math.cos(heli.a) * heli.v * dt));

  const ground = groundAt(heli.x, heli.z, 3);
  heli.lift -= dt;
  if (heli.lift > 0) heli.y += (ground + 10 - heli.y) * Math.min(1, dt * 1.5); // automatic take-off
  else if (rise) heli.y += 12 * dt;
  else if (sink) heli.y -= 12 * dt;
  heli.y = Math.min(110, heli.y);
  if (heli.y < ground) heli.y += (ground - heli.y) * Math.min(1, dt * 8); // float up over things, never crash
  heli.rotor += dt * 28;
}

const upKeys = () => held('KeyW', 'Space', 'ArrowUp', 'PageUp'), downKeys = () => held('KeyS', 'ShiftLeft', 'ShiftRight', 'ArrowDown', 'PageDown');
const turnKeys = () => (held('ArrowLeft', 'KeyA') ? 1 : 0) - (held('ArrowRight', 'KeyD') ? 1 : 0);
function countdown(dt) {
  const before = rocket.count;
  rocket.count = Math.max(0, rocket.count - dt);
  for (const n of [3, 2, 1]) if (before > n && rocket.count <= n) tone(660, .18, 'triangle', .08, 0, 0, 5);
  if (before > 0 && rocket.count === 0) { tone(990, .6, 'triangle', .1, 0, 0, 6); whoosh(true); }
}
// straight up and down over a pad: speeds up like a real rocket, just much quicker, and hovers when you let go.
// Going down it slows by itself near the ground, so it always lands softly. Returns true on touchdown.
function climb(dt, up, down) {
  if (rocket.count > 0) { countdown(dt); up = down = false; }
  if (up) rocket.vy = Math.min(CLIMB_MAX, rocket.vy + (rocket.vy < 0 ? 40 : CLIMB_ACC) * dt);
  else if (down) { const want = -Math.max(3, Math.min(CLIMB_MAX, rocket.y * .35)); rocket.vy += (want - rocket.vy) * Math.min(1, dt * 3); }
  else rocket.vy *= Math.pow(.05, dt);
  const was = rocket.y;
  rocket.y = Math.max(0, rocket.y + rocket.vy * dt);
  if (was === 0 && rocket.y > 0) rocket.lift = T;
  if (rocket.y === 0) rocket.vy = Math.max(0, rocket.vy);
  rocket.thrust += ((rocket.count > 0 ? 0 : up ? 1 : rocket.y > 0 ? .35 : 0) - rocket.thrust) * Math.min(1, dt * 5);
  return was > 0 && rocket.y === 0;
}
function flyRocketEarth(dt) {
  rocket.a += turnKeys() * 1.2 * dt; // turns on the spot, but never drifts away from the pad
  climb(dt, upKeys(), downKeys());
  if (rocket.y >= SPACE_Y) enterSpace();
}
function softBoing() { if (T - lastBoing > .5) { boing(); lastBoing = T; } }
function flySpace(dt) {
  const fwd = held('ArrowUp'), back = held('ArrowDown'), rise = held('KeyW', 'Space', 'PageUp');
  const sink = held('KeyS', 'ShiftLeft', 'ShiftRight', 'PageDown');
  if (fwd) rocket.v += 30 * dt; else if (back) rocket.v -= 30 * dt; else rocket.v *= Math.pow(.5, dt);
  rocket.v = Math.max(-20, Math.min(90, rocket.v));
  rocket.a += turnKeys() * 1.2 * dt;
  rocket.vy += ((rise ? 40 : sink ? -40 : 0) - rocket.vy) * Math.min(1, dt * 3);
  rocket.x += Math.sin(rocket.a) * rocket.v * dt; rocket.z += Math.cos(rocket.a) * rocket.v * dt; rocket.y += rocket.vy * dt;
  rocket.pitch += (rocket.v / 90 * 1.1 - rocket.pitch) * Math.min(1, dt * 3); // leans into the flight
  rocket.thrust += ((fwd || rise ? 1 : .25) - rocket.thrust) * Math.min(1, dt * 5);
  const r = Math.hypot(rocket.x, rocket.y, rocket.z);
  if (r > SB) { // the edge of space: a soft boing back in
    for (const k of ['x', 'y', 'z']) rocket[k] *= (SB - 1) / r;
    rocket.v *= -.3; rocket.vy = 0; softBoing();
  }
  for (const b of bodies()) { // bump softly off the planets and the space station
    const dx = rocket.x - b.x, dy = rocket.y - b.y, dz = rocket.z - b.z, d = Math.hypot(dx, dy, dz), min = b.r + 10;
    if (d < min) {
      const k = min / (d || 1);
      Object.assign(rocket, { x: b.x + dx * k, y: b.y + dy * k, z: b.z + dz * k, v: rocket.v * -.3, vy: 0 });
      softBoing();
    }
  }
  for (let i = 0; i < spaceStars.length; i++) {
    const st = spaceStars[i], sy = st.y + Math.sin(T * 3 + st.phase) * 1.5;
    if (Math.hypot(st.x - rocket.x, sy - rocket.y, st.z - rocket.z) < 14) {
      cheer(st.x, sy, st.z); spaceStars[i] = spaceStar();
    }
  }
  if (Math.hypot(rocket.x - MOON.x, rocket.y - MOON.y, rocket.z - MOON.z) < MOON.r + 20) landOnMoon();
  else if (r < ER + GAP - 40) reenter();
}
function flyRocketMoon(dt) {
  if (rocket.auto) { if (climb(dt, false, true)) { rocket.auto = false; buggyOut(); } return; } // lands by itself
  rocket.a += turnKeys() * 1.2 * dt;
  if (climb(dt, upKeys(), downKeys())) buggyOut();
  if (rocket.y >= MOON_TOP) leaveMoon();
}
// the moon buggy drives like the car, but floats: bumps throw it up and it comes down slowly
function driveBuggy(dt) {
  const up = held('ArrowUp', 'KeyW'), down = held('ArrowDown', 'KeyS');
  const left = held('ArrowLeft', 'KeyA'), right = held('ArrowRight', 'KeyD');
  const ground = buggy.y <= buggy.g + .02;
  if (up) buggy.v += (buggy.v < 0 ? 24 : 10) * dt;
  else if (down) buggy.v -= (buggy.v > 0 ? 24 : 8) * dt;
  else if (ground) buggy.v *= Math.pow(.4, dt);
  buggy.v = Math.max(-6, Math.min(14, buggy.v));
  const target = (left ? 1 : 0) - (right ? 1 : 0);
  buggy.steer += (target - buggy.steer) * Math.min(1, dt * 8);
  buggy.a += buggy.steer * 2.0 * dt * Math.max(-1, Math.min(1, buggy.v / 5));
  buggy.spin += buggy.v * dt / .6;
  const nx = buggy.x + Math.sin(buggy.a) * buggy.v * dt, nz = buggy.z + Math.cos(buggy.a) * buggy.v * dt;
  if (Math.hypot(nx, nz) > MOONR - 4 || Math.hypot(nx - rocket.x, nz - rocket.z) < 3.4) { // edge of the surface, or the rocket
    if (Math.abs(buggy.v) > 3) softBoing();
    buggy.v *= -.3;
  } else { buggy.x = nx; buggy.z = nz; }
  const g = moonGround(buggy.x, buggy.z);
  if (ground) { const rise = (g - buggy.g) / dt; buggy.vy = rise > 1 ? rise * .9 : 0; buggy.y = g; }
  if (!ground || buggy.vy > 0) {
    buggy.vy -= MOON_G * dt; buggy.y += buggy.vy * dt;
    if (buggy.y < g) { buggy.y = g; buggy.vy = 0; }
  }

// Fed every frame time in ms; returns true once, after `secs` of frames averaging slower than `limitMs`.
function makePerfWatch(limitMs = 25, secs = 3, warmup = 2) {

    if (fired) return false;
    if (!(ms >= 0 && ms <= 250)) { sum = 0; n = 0; return false; } // the tab was hidden or paused, not slow
    if (skip > 0) { skip -= ms; return false; }
    sum += ms; n++;

  };

  gl.uniform1f(prog.uShadowOn, shadows ? 1 : 0); gl.uniform1f(prog.uTexel, 1 / SM);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(prog.uShadow, 0);
  gl.enable(gl.CULL_FACE);
  if (scene === 'space') drawSpaceThings();
  else if (scene === 'moon') drawMoonThings();
  else {
    worldAlpha = 1 - gone;
    if (gone > 0) { gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); }
    solidThings();
    if (worldAlpha > 0) draw3(clouds, ID, WHITE, worldAlpha);
    gl.disable(gl.BLEND); worldAlpha = 1;
    if (!shadows) drawBlobShadows();
  }
  for (const c of confetti) dbox(c.x, c.y, c.z, .45, .45, .45, c.life * 5, c.col);

  // see-through things last, without hiding what's behind them
  gl.disable(gl.CULL_FACE); gl.enable(gl.BLEND); gl.depthMask(false);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  if (fade > 0) { // high up, the round Earth takes the flat world's place, right below the rocket
    setFog(1e5, 2e5);
    const gy = rocket.y + MOUNTH - GAP - ER;
    draw3(earthMesh, globeAt(rocket.x, gy, rocket.z, ER, T * .02), WHITE, fade);
    draw3(earthClouds, globeAt(rocket.x, gy, rocket.z, ER * 1.03, T * .035), WHITE, .7 * fade);
    setFog(fog[0], fog[1]);
  }
  if (scene === 'space') draw3(earthClouds, globeAt(0, 0, 0, ER * 1.03, T * .035), WHITE, .7);
  if (scene === 'moon') {
    draw3(earthClouds, globeAt(-320, 260, -760, 80 * 1.03, T * .035), WHITE, .85);
    tracks.forEach((t, i) => { // the oldest marks fade away
      const c = Math.cos(t.a), sn = Math.sin(t.a), al = .6 * Math.min(1, (i + 1) / 60);
      for (const sx of [-1.2, 1.2]) draw3(cube, chain(mT(t.x + sx * c, .06, t.z - sx * sn), mRY(t.a), mS(.6, .02, 1)), hex(0x4a4a4a), al);
    });
  }
  if (h) {
    const hub = chain(at(heli), mT(0, 3.6, 0));
    for (const extra of [0, Math.PI / 2]) draw3(blade, chain(hub, mRY(heli.rotor + extra)), WHITE, .45);
    draw3(disc, hub, WHITE, .22);
  }
  for (const f of fx) if (f.dust) {
    const t = 1 - f.life / f.max, s = (.5 + t * 1.6) * f.size;
    draw3(ball, chain(mT(f.x, f.y, f.z), mS(s, s * .8, s)), scene === 'moon' ? [.75, .75, .75] : DUST, .35 * (1 - t));
  }
  for (const f of fx) if (f.spray) {
    const t = 1 - f.life / f.max, s = .22 + t * .4;
    draw3(ball, chain(mT(f.x, f.y, f.z), mS(s, s, s)), WHITE, .7 * (1 - t * t));
  }
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // glows add light
  drawFlame();
  if (earth) for (const s of stars) {
    const y = s.y + Math.sin(T * 3 + s.phase) * .5, g = (s.sky ? 6.5 : 4.8) * (1 + .06 * Math.sin(T * 5 + s.phase));
    draw3(glowBall, chain(mT(s.x, y, s.z), mS(g, g, g)), [1, .8, .25], .4);
  }
  if (scene === 'space') for (const s of spaceStars) {
    const g = 22 * (1 + .06 * Math.sin(T * 5 + s.phase));
    draw3(glowBall, chain(mT(s.x, s.y + Math.sin(T * 3 + s.phase) * 1.5, s.z), mS(g, g, g)), [1, .8, .25], .45);
  }
  for (const f of fx) if (!f.dust && !f.spray) {
    const s = .25 + .3 * Math.abs(Math.sin(f.life * 18));
    draw3(sparkMesh, chain(mT(f.x, f.y, f.z), mRY(f.life * 9), mS(s, s, s)), f.col, Math.min(1, f.life * 2));
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
}

let last = performance.now(), dtDraw = 0, frameMs = 16;
function frame(now) {
  const raw = now - last;
  if (raw > 0 && raw < 1000) frameMs += (raw - frameMs) * .05;
  dtDraw = Math.min(.05, raw / 1000); last = now; T += dtDraw;
  if (perfWatch(raw)) lowerQuality();
  if (started) update(dtDraw);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
